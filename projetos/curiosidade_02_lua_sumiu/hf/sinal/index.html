<!doctype html>
<!-- CURIOSIDADE 02 · cena 2 — Terra e Lua (simulação): a Lua some sem explodir e a mudança leva ~1,3 s para chegar à Terra.
     A viagem da linha dura exatamente 1,3 s na animação. Renderizado pelo HyperFrames como PNG transparente
     (OverlayHyperFrames "cur02-sinal"). Tempos locais (s): desapareceu 2.23 · Terra 4.73 · segundo 7.7 · fim 8.53 -->
<html lang="pt-BR" data-resolution="portrait">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=1080, height=1920" />
<script src="assets/gsap.min.js"></script>
<style>
@font-face { font-family: "Anton"; src: url("assets/anton.woff2") format("woff2"); }
@font-face { font-family: "Montserrat"; src: url("assets/montserrat900.woff2") format("woff2"); font-weight: 900; }
html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
#root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
#g { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="8.53" data-width="1080" data-height="1920">
<div id="g" class="clip" data-start="0" data-duration="8.53" data-track-index="0" data-track-kind="graphics">
<svg viewBox="0 0 1080 1920" width="1080" height="1920" data-layout-allow-overflow>
  <defs>
    <radialGradient id="oc" cx="0.35" cy="0.3" r="0.9"><stop offset="0" stop-color="#3f9be0"/><stop offset="1" stop-color="#123a6b"/></radialGradient>
  </defs>
  <g id="terra" opacity="0">
    <circle cx="360" cy="1260" r="250" fill="#7fd0ff" opacity="0.18"/>
    <circle cx="360" cy="1260" r="210" fill="url(#oc)" stroke="#10121f" stroke-width="8"/>
    <path d="M 250,1150 C 320,1100 420,1130 430,1200 C 440,1270 380,1300 330,1290 C 270,1280 220,1220 250,1150 Z" fill="#79c27a" stroke="#163626" stroke-width="5"/>
    <path d="M 380,1330 C 430,1320 480,1350 470,1400 C 450,1430 400,1420 380,1390 Z" fill="#79c27a" stroke="#163626" stroke-width="5"/>
    <text x="360" y="1540" text-anchor="middle" font-family="Anton" font-size="52" fill="#ffffff">TERRA</text>
  </g>
  <g id="lua" opacity="0">
    <circle cx="790" cy="520" r="120" fill="#fff6d8" opacity="0.15"/>
    <circle cx="790" cy="520" r="75" fill="#f4efe0" stroke="#10121f" stroke-width="6"/>
    <circle cx="770" cy="505" r="14" fill="#d8d2c0"/><circle cx="812" cy="540" r="11" fill="#d8d2c0"/>
  </g>
  <circle id="fantasma" cx="790" cy="520" r="75" fill="none" stroke="#cfe0ff" stroke-width="5" stroke-dasharray="12 10" opacity="0"/>
  <text id="rotLua" x="790" y="660" text-anchor="middle" font-family="Anton" font-size="44" fill="#ffffff" opacity="0">LUA</text>
  <path id="linha" d="M 760,580 L 450,1090" fill="none" stroke="#ffd60a" stroke-width="8" stroke-dasharray="14 12" opacity="0"/>
  <circle id="ponto" cx="760" cy="580" r="16" fill="#ffd60a" opacity="0"/>
  <g id="contador" opacity="0">
    <rect x="590" y="820" width="380" height="150" rx="26" fill="#111a2e" stroke="#ffd60a" stroke-width="6"/>
    <text id="num" x="780" y="925" text-anchor="middle" font-family="Anton" font-size="84" fill="#ffd60a">0,0 s</text>
  </g>
  <text id="obs" x="540" y="1700" text-anchor="middle" font-family="Montserrat" font-weight="900" font-size="32" fill="#cfe0ff" opacity="0">a luz e a gravidade levam ~1,3 s para chegar</text>
</svg>
</div>
</div>
<script>
const tl = gsap.timeline({ paused: true });
tl.to(["#terra", "#lua", "#rotLua"], { opacity: 1, duration: 0.4 }, 0.1);
tl.to("#lua", { opacity: 0, duration: 0.5, ease: "power1.in" }, 2.2);
tl.to("#fantasma", { opacity: 0.8, duration: 0.4 }, 2.4);
tl.to(["#linha", "#ponto", "#contador"], { opacity: 1, duration: 0.3 }, 4.8);
tl.fromTo("#ponto", { attr: { cx: 760, cy: 580 } }, { attr: { cx: 450, cy: 1090 }, duration: 1.3, ease: "none" }, 5.2);
const c = { v: 0 };
tl.to(c, { v: 1.3, duration: 1.3, ease: "none", onUpdate: () => { document.getElementById("num").textContent = (c.v < 1.3 ? c.v.toFixed(1) : "~1,3").replace(".", ",") + " s"; } }, 5.2);
tl.to("#obs", { opacity: 1, duration: 0.3 }, 6.6);
tl.to("#g", { opacity: 0, duration: 0.3 }, 8.2);
window.__timelines = window.__timelines || {};
window.__timelines["main"] = tl;
</script>
</body>
</html>
