<!doctype html>
<!--
  Teste HyperFrames × Viral Video Engine — "O alerta que tira o sossego" (8 s, ficção original, pt-BR).
  Nível "native": cenário em camadas, celular + notificação, câmera, legendas (geradas de tempos.json por vve_para_hf.py).
  Nível "hosted": o personagem Leo vem do rig da VVE (engine/src/kit/Personagem.tsx) via assets/lib/vve-kit.js,
  desenhado para o tempo pedido no evento hf-seek (sem conversão do React).
-->
<html lang="pt-BR" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/lib/gsap.min.js"></script>
    <script src="assets/lib/vve-kit.js"></script>
    <script src="assets/tempos.js"></script>
    <style>
      @font-face { font-family: "Anton"; src: url("assets/fonts/anton.woff2") format("woff2"); font-weight: 400; }
      :root { --tinta: #10121f; --amarelo: #ffd60a; --vermelho: #ff3b3b; --branco: #f8f7f2; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #2a1f3a; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "Montserrat", sans-serif; }
      #cena { position: absolute; inset: 0; transform-origin: 50% 45%; }
      .camada { position: absolute; inset: 0; }
      #leo { position: absolute; inset: 0; }
      #celular { position: absolute; left: 600px; top: 330px; width: 380px; height: 740px; }
      #notif { position: absolute; left: 14px; top: 170px; width: 352px; }
      #digitando { position: absolute; left: 40px; top: 500px; }
      #selo { position: absolute; left: 0; width: 1080px; top: 250px; text-align: center; }
      #selo span { display: inline-block; font-family: "Anton"; font-size: 104px; color: var(--amarelo);
        -webkit-text-stroke: 12px var(--tinta); paint-order: stroke fill; }
      #tarja { position: absolute; left: 40px; top: 190px; }
      /* legendas: zona segura vertical (texto entre 168 e 1330 px) */
      #legendas { position: absolute; left: 0; top: 1180px; width: 1080px; height: 160px; overflow: visible; }
      .cap { position: absolute; left: 70px; right: 150px; top: 0; text-align: center; overflow: visible; }
      .w { display: inline-block; margin: 0 9px; font-family: "Anton"; font-size: 100px; line-height: 1.08; color: #fff;
        -webkit-text-stroke: 10px #000; paint-order: stroke fill; text-shadow: 0 6px 14px rgba(0,0,0,0.6); }
      .w.dest { color: var(--amarelo); font-size: 108px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="8.000" data-width="1080" data-height="1920">
      <div id="cena" class="clip" data-start="0" data-duration="8" data-track-index="0" data-track-kind="graphics">
        <!-- fundo: parede, janela de fim de tarde, quadro, luminária -->
        <svg id="fundo" class="camada" data-layout-allow-overflow viewBox="0 0 1080 1920" width="1080" height="1920">
          <defs>
            <linearGradient id="parede" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f2b880"/><stop offset="1" stop-color="#d98a6a"/></linearGradient>
            <linearGradient id="ceu" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff9a62"/><stop offset="1" stop-color="#ffd59e"/></linearGradient>
            <radialGradient id="sol"><stop offset="0" stop-color="#fff4cc"/><stop offset="1" stop-color="#fff4cc" stop-opacity="0"/></radialGradient>
          </defs>
          <rect x="-200" y="-200" width="1480" height="1700" fill="url(#parede)"/>
          <g id="listras" opacity="0.18">
            <rect x="0" y="-200" width="10" height="1700" fill="#a85a3c"/><rect x="120" y="-200" width="10" height="1700" fill="#a85a3c"/>
            <rect x="240" y="-200" width="10" height="1700" fill="#a85a3c"/><rect x="360" y="-200" width="10" height="1700" fill="#a85a3c"/>
            <rect x="480" y="-200" width="10" height="1700" fill="#a85a3c"/><rect x="600" y="-200" width="10" height="1700" fill="#a85a3c"/>
            <rect x="720" y="-200" width="10" height="1700" fill="#a85a3c"/><rect x="840" y="-200" width="10" height="1700" fill="#a85a3c"/>
            <rect x="960" y="-200" width="10" height="1700" fill="#a85a3c"/>
          </g>
          <g transform="translate(250 560)">
            <rect x="-190" y="-230" width="380" height="460" rx="14" fill="url(#ceu)" stroke="#10121f" stroke-width="12"/>
            <circle id="sol-disco" cx="40" cy="120" r="150" fill="url(#sol)"/>
            <circle cx="40" cy="120" r="54" fill="#fff4cc"/>
            <path d="M -190,140 L -120,90 L -60,130 L 10,70 L 90,120 L 190,80 L 190,230 L -190,230 Z" fill="#7a3d5a"/>
            <rect x="-6" y="-230" width="12" height="460" fill="#10121f"/><rect x="-190" y="-6" width="380" height="12" fill="#10121f"/>
          </g>
          <g transform="translate(800 520) rotate(3)">
            <rect x="-120" y="-150" width="240" height="300" fill="#2e86ab" stroke="#10121f" stroke-width="10"/>
            <circle cx="0" cy="-20" r="62" fill="#ffd60a"/><path d="M -90,120 L -10,30 L 90,120 Z" fill="#e4572e"/>
          </g>
          <rect x="-200" y="1500" width="1480" height="600" fill="#6b4a3a"/>
          <rect x="-200" y="1490" width="1480" height="24" fill="#3a2621"/>
        </svg>
        <!-- sofá (camada do meio) -->
        <svg id="sofa" class="camada" data-layout-allow-overflow viewBox="0 0 1080 1920" width="1080" height="1920">
          <rect x="60" y="1180" width="960" height="260" rx="60" fill="#3d7bd9" stroke="#10121f" stroke-width="12"/>
          <rect x="40" y="1330" width="1000" height="200" rx="40" fill="#2f63b3" stroke="#10121f" stroke-width="12"/>
          <rect x="20" y="1250" width="120" height="290" rx="50" fill="#3d7bd9" stroke="#10121f" stroke-width="12"/>
          <rect x="940" y="1250" width="120" height="290" rx="50" fill="#3d7bd9" stroke="#10121f" stroke-width="12"/>
          <ellipse cx="860" cy="1290" rx="90" ry="60" fill="#ffd60a" stroke="#10121f" stroke-width="9"/>
        </svg>
        <!-- personagem Leo (rig da VVE, hosted) -->
        <div id="leo"></div>
        <!-- planta em primeiro plano (paralaxe) -->
        <svg id="frente" class="camada" data-layout-allow-overflow viewBox="0 0 1080 1920" width="1080" height="1920">
          <g transform="translate(1000 1800)">
            <path d="M -70,0 L 70,0 L 55,-150 L -55,-150 Z" fill="#c8553d" stroke="#10121f" stroke-width="10"/>
            <g id="folhas">
              <path d="M 0,-150 C -40,-300 -160,-360 -230,-330 C -160,-290 -80,-220 0,-150 Z" fill="#2f7a46" stroke="#10121f" stroke-width="8"/>
              <path d="M 0,-150 C 20,-330 90,-430 160,-450 C 110,-350 60,-250 0,-150 Z" fill="#3b9156" stroke="#10121f" stroke-width="8"/>
              <path d="M 0,-150 C -60,-260 -60,-420 -10,-500 C 10,-400 20,-280 0,-150 Z" fill="#2f7a46" stroke="#10121f" stroke-width="8"/>
            </g>
          </g>
        </svg>
      </div>

      <!-- celular grande com o alerta (nativo HyperFrames) -->
      <div id="celular" class="clip" data-start="1.75" data-duration="6.25" data-track-index="1" data-track-kind="graphics">
        <svg viewBox="0 0 380 740" width="380" height="740">
          <rect x="4" y="4" width="372" height="732" rx="54" fill="#1b1d29" stroke="#10121f" stroke-width="8"/>
          <rect x="22" y="22" width="336" height="696" rx="40" fill="#24345f"/>
          <rect x="150" y="34" width="80" height="16" rx="8" fill="#0b0c12"/>
          <text x="190" y="120" text-anchor="middle" font-family="Montserrat" font-weight="800" font-size="64" fill="#fff">14:32</text>
        </svg>
        <div id="notif">
          <svg viewBox="0 0 352 300" width="352" height="300">
            <rect x="0" y="0" width="352" height="300" rx="24" fill="#f4f6fb" stroke="#10121f" stroke-width="4"/>
            <rect x="16" y="16" width="46" height="46" rx="12" fill="#ff3b3b"/>
            <text x="39" y="50" text-anchor="middle" font-family="Anton" font-size="30" fill="#fff">!</text>
            <text x="74" y="49" font-family="Montserrat" font-weight="900" font-size="28" fill="#5b6275">ALERTA</text>
            <circle cx="50" cy="128" r="34" fill="#e4572e"/><text x="50" y="141" text-anchor="middle" font-family="Montserrat" font-weight="900" font-size="34" fill="#fff">M</text>
            <text x="98" y="122" font-family="Montserrat" font-weight="900" font-size="36" fill="#121626">Mãe</text>
            <text x="98" y="158" font-family="Montserrat" font-weight="800" font-size="28" fill="#39405a">visualizou ✓✓</text>
            <text x="20" y="250" font-family="Montserrat" font-weight="900" font-size="28" fill="#c92a2a">…e não respondeu.</text>
          </svg>
        </div>
        <div id="digitando">
          <svg viewBox="0 0 160 70" width="160" height="70">
            <rect x="0" y="0" width="160" height="70" rx="35" fill="#f4f6fb" stroke="#10121f" stroke-width="4"/>
            <circle id="p1" cx="45" cy="35" r="11" fill="#5b6275"/><circle id="p2" cx="80" cy="35" r="11" fill="#5b6275"/><circle id="p3" cx="115" cy="35" r="11" fill="#5b6275"/>
          </svg>
        </div>
      </div>

      <div id="selo" class="clip" data-start="5.95" data-duration="2.05" data-track-index="2" data-track-kind="graphics"><span>ADEUS, SOSSEGO</span></div>

      <div id="tarja" class="clip" data-start="0" data-duration="8" data-track-index="3" data-track-kind="graphics">
        <svg viewBox="0 0 370 62" width="370" height="62"><rect x="2" y="2" width="366" height="58" rx="15" fill="#111a2e" stroke="#ffd60a" stroke-width="3"/>
          <text x="185" y="41" text-anchor="middle" font-family="Montserrat" font-weight="900" font-size="28" fill="#fff3b3">FICÇÃO • HUMOR</text></svg>
      </div>

      <div id="legendas" class="clip" data-start="0" data-duration="8" data-track-index="4" data-track-kind="captions">
        <!-- LEGENDAS:INICIO -->
        <div id="cap-0" class="clip cap" data-start="0.200" data-duration="0.650"><span class="w" data-ini="0.250" data-fim="0.528">VOCÊ</span><span class="w" data-ini="0.528" data-fim="0.699">TÁ</span><span class="w" data-ini="0.699" data-fim="0.870">DE</span></div>
        <div id="cap-1" class="clip cap" data-start="0.820" data-duration="0.308"><span class="w" data-ini="0.870" data-fim="1.148">BOA</span></div>
        <div id="cap-2" class="clip cap" data-start="1.098" data-duration="0.757"><span class="w" data-ini="1.148" data-fim="1.319">E</span><span class="w" data-ini="1.319" data-fim="1.490">O</span><span class="w" data-ini="1.490" data-fim="1.875">CELULAR</span></div>
        <div id="cap-3" class="clip cap" data-start="1.825" data-duration="0.535"><span class="w dest" data-ini="1.875" data-fim="2.260">APITA.</span></div>
        <div id="cap-4" class="clip cap" data-start="2.330" data-duration="0.485"><span class="w" data-ini="2.380" data-fim="2.835">ALERTA</span></div>
        <div id="cap-5" class="clip cap" data-start="2.785" data-duration="1.270"><span class="w" data-ini="2.835" data-fim="3.164">SUA</span><span class="w dest" data-ini="3.164" data-fim="3.367">MÃE</span><span class="w dest" data-ini="3.367" data-fim="4.075">VISUALIZOU</span></div>
        <div id="cap-6" class="clip cap" data-start="4.025" data-duration="1.010"><span class="w" data-ini="4.075" data-fim="4.277">E</span><span class="w" data-ini="4.277" data-fim="4.480">NÃO</span><span class="w" data-ini="4.480" data-fim="4.935">RESPONDEU.</span></div>
        <div id="cap-7" class="clip cap" data-start="5.005" data-duration="0.378"><span class="w" data-ini="5.055" data-fim="5.403">PRONTO.</span></div>
        <div id="cap-8" class="clip cap" data-start="5.353" data-duration="1.377"><span class="w" data-ini="5.403" data-fim="5.884">ACABOU</span><span class="w" data-ini="5.884" data-fim="6.098">O</span><span class="w dest" data-ini="6.098" data-fim="6.580">SOSSEGO.</span></div>
        <!-- LEGENDAS:FIM -->
      </div>

      <audio id="mix" class="clip" data-start="0" data-duration="8.000" data-track-index="5" data-volume="1" src="assets/audio/mix.wav"></audio>
    </div>

    <script>
      // ---------- tempos da narração (gerados de tempos.json) ----------
      const T = window.TEMPOS;
      const limpa = (s) => s.toLowerCase().normalize("NFD").replace(/[^a-z0-9]/g, "");
      const P = (w, n = 1) => { let c = 0; for (const p of T.palavras) if (limpa(p.w) === limpa(w) && ++c === n) return p.ini; throw new Error("palavra " + w); };
      const t = { celular: P("celular"), apita: P("apita"), alerta: P("Alerta"), mae: P("mãe"), vis: P("visualizou"), nao: P("não"), resp: P("respondeu"), pronto: P("Pronto"), acabou: P("Acabou"), sossego: P("sossego") };

      const tl = gsap.timeline({ paused: true });

      // ---------- câmera (cena inteira) e paralaxe ----------
      tl.fromTo("#cena", { scale: 1.0, x: 0, y: 0 }, { scale: 1.08, x: 30, y: 10, duration: t.apita, ease: "none" }, 0);
      tl.to("#cena", { scale: 1.38, x: 40, y: 140, duration: 0.22, ease: "power3.out" }, t.mae - 0.05);
      tl.to("#cena", { scale: 1.3, x: 30, y: 110, duration: t.pronto - t.mae - 0.3, ease: "sine.inOut" }, t.mae + 0.2);
      tl.to("#cena", { scale: 1.12, x: 60, y: 40, duration: 0.5, ease: "power2.inOut" }, t.pronto - 0.1);
      tl.to("#cena", { scale: 1.2, x: 80, y: 60, duration: 8 - t.pronto - 0.4, ease: "none" }, t.pronto + 0.4);
      tl.fromTo("#frente", { x: 0 }, { x: -60, duration: 8, ease: "none" }, 0);
      tl.fromTo("#fundo", { x: 0 }, { x: 18, duration: 8, ease: "none" }, 0);
      tl.fromTo("#folhas", { rotation: -2, transformOrigin: "50% 100%" }, { rotation: 3, duration: 1.6, ease: "sine.inOut", yoyo: true, repeat: 4 }, 0);
      tl.fromTo("#sol-disco", { scale: 0.9, transformOrigin: "50% 50%" }, { scale: 1.12, duration: 2, ease: "sine.inOut", yoyo: true, repeat: 3 }, 0);

      // ---------- celular: entra vibrando no "apita", alerta cai, "digitando…" some ----------
      tl.fromTo("#celular", { y: 900, rotation: 12, opacity: 0 }, { y: 0, rotation: 4, opacity: 1, duration: 0.35, ease: "back.out(1.6)" }, 1.75);
      for (let k = 0; k < 8; k++) tl.to("#celular", { x: k % 2 ? -10 : 10, duration: 0.04, ease: "none" }, t.apita + k * 0.045);
      tl.to("#celular", { x: 0, duration: 0.05 }, t.apita + 0.4);
      tl.fromTo("#notif", { y: -260, opacity: 0, scale: 0.85 }, { y: 0, opacity: 1, scale: 1, duration: 0.3, ease: "back.out(1.8)" }, t.alerta - 0.05);
      tl.fromTo("#notif", { scale: 1 }, { scale: 1.08, duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1 }, t.mae);
      tl.fromTo("#digitando", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.15, ease: "back.out(2)" }, t.nao - 0.1);
      ["#p1", "#p2", "#p3"].forEach((id, i) => tl.fromTo(id, { y: 0 }, { y: -10, duration: 0.15, ease: "sine.inOut", yoyo: true, repeat: 3 }, t.nao + i * 0.08));
      tl.to("#digitando", { opacity: 0, scale: 0.6, duration: 0.15, ease: "power2.in" }, t.resp + 0.35);
      tl.to("#celular", { y: 120, rotation: 14, opacity: 0.0, duration: 0.45, ease: "power2.in" }, t.pronto + 0.1);

      // ---------- selo final ----------
      tl.fromTo("#selo span", { scale: 0.3, rotation: -4, opacity: 0 }, { scale: 1, rotation: -4, opacity: 1, duration: 0.3, ease: "back.out(2)" }, 0);

      // ---------- legendas: pop da palavra falada (elementos escritos no HTML) ----------
      document.querySelectorAll("#legendas .cap").forEach((g) => {
        const ini = parseFloat(g.dataset.start), dur = parseFloat(g.dataset.duration);
        tl.fromTo(g, { scale: 0.78, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.16, ease: "back.out(2)" }, ini);
        tl.to(g, { opacity: 0, duration: 0.1, ease: "power2.in" }, ini + dur - 0.1);
        tl.set(g, { opacity: 0, visibility: "hidden" }, ini + dur); // corte duro: grupo antigo nunca fica na tela
        g.querySelectorAll(".w").forEach((w) => {
          const wi = parseFloat(w.dataset.ini);
          tl.fromTo(w, { scale: 1, y: 0 }, { scale: 1.14, y: -6, duration: 0.08, ease: "power2.out" }, wi);
          tl.to(w, { scale: 1, y: 0, duration: 0.16, ease: "power2.inOut" }, wi + 0.09);
        });
      });

      window.__timelines["main"] = tl;
      tl.seek(0);

      // ---------- personagem Leo: rig da VVE desenhado para o tempo pedido (nível hosted) ----------
      const V = window.VVE, F = (s) => Math.round(s * V.FPS);
      const LEO = { pele: "#bc805e", cabelo: "cacheado", corCabelo: "#221b2e", roupa: "moletom", cor: "#e53935", cor2: "#ffd2c4", calca: "#273a59", sapato: "#e8eaef", corOlho: "#3b2416", corpo: "medio" };
      const pz = V.poses, ex = V.expressoes, an = V.anim;
      function poseLeo(f) {
        return pz.poseEm(f, [
          [0, (x) => ({ ...pz.parado(x, 3), bracoE: [30, 120], bracoD: [30, 120], frenteE: true, frenteD: true, cabecaIncl: 6, olhar: [0.5, -0.4] })],
          [F(t.celular) - 4, (x) => pz.olhandoCelular(x, 3, 0.2)],
          [F(t.mae) - 2, (x) => ({ ...pz.olhandoCelular(x, 3, 0.5), tronco: -7, cabecaIncl: -8, olhar: [0.6, 0.2] })],
          [F(t.nao), (x) => ({ ...pz.olhandoCelular(x, 3, 0.35), tronco: -4, olhar: [0.7, 0.3] })],
          [F(t.pronto) - 2, (x) => ({ ...pz.encolhendoOmbros(x, 3), cabecaIncl: 12, olhar: [0, 0.7] })],
          [F(t.sossego) - 2, (x) => ({ ...pz.encolhendoOmbros(x, 3), bracoE: [70, 20], bracoD: [70, 20], cabecaIncl: 16, tronco: 4, agachar: 18, olhar: [0, 0.9] })],
        ], 6);
      }
      function exprLeo(f) {
        return ex.exprEm(f, [[0, "sereno"], [F(t.apita) - 2, "surpreso"], [F(t.mae) - 2, "horrorizado"], [F(t.nao), "medo"], [F(t.pronto), "triste"]], 5);
      }
      const leoDiv = document.getElementById("leo");
      function renderAt(segundos) {
        const f = Math.max(0, Math.round(segundos * V.FPS));
        const segura = f >= F(t.celular) - 4 && f < F(t.pronto) + 6;
        leoDiv.innerHTML = V.svgPersonagens([{
          id: "leo", x: 420, y: 1505, escala: 1.25, visual: LEO, estilo: V.ESTILOS_PERSONAGEM.conto,
          pose: poseLeo(f), expr: exprLeo(f), olhosAbertos: an.piscar(f, 3),
          itemD: segura ? V.celularMao(f >= F(t.apita)) : undefined,
        }]);
      }
      window.addEventListener("hf-seek", (e) => renderAt(e.detail.time));
      renderAt(0);
    </script>
  </body>
</html>
